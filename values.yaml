image:
  repository: ""
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

# Existing Secret in the release namespace; every key becomes an environment variable (DATABASE_URL, S3 keys, SMTP password).
envFromSecret: ""

# RADIOPATH_WORKERS and RADIOPATH_REDIS_URL are set by the chart.
env:
  RADIOPATH_TRUST_PROXY: "true"
  RADIOPATH_REGISTRATION: "false"
  RADIOPATH_SMTP_HOST: <smtp-host>
  RADIOPATH_SMTP_PORT: "587"
  RADIOPATH_SMTP_USER: <smtp-user>
  RADIOPATH_MAIL_FROM: <from-address>
  RADIOPATH_DATASET_S3_ENDPOINT: <s3-endpoint>
  RADIOPATH_DATASET_S3_BUCKET: <s3-bucket>

web:
  replicas: 2
  # Web pods (RADIOPATH_MODE=web) serve the app and the API and compute nothing: no datasets, no S3, no /tmp.
  env: {}
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 256Mi

worker:
  replicas: 1
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 100
  # Also route Service traffic to worker pods (RADIOPATH_MODE=all instead of worker).
  serveWeb: false
  workers: 1
  # Worker pods compute coverages, link analyses and HF: 16 x 39 MB of terrain and canopy tiles, up to 130 MB of HF
  # data (one month after another, as they are asked for) plus 100 MB. The HF data set is downloaded into /tmp.
  env:
    RADIOPATH_DEM_CACHE_TILES: "16"
  resources:
    requests:
      cpu: "1"
      memory: 768Mi
    limits:
      cpu: "4"
      memory: 2Gi

valkey:
  enabled: true
  image:
    repository: valkey/valkey
    tag: "9.1.2-alpine"
    pullPolicy: IfNotPresent
  # Applies to each of the three nodes (StatefulSet, one master, two replicas,
  # Sentinel sidecars). No persistence: the replicas carry the cache across
  # node restarts.
  maxmemory: 512mb
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 620Mi
  sentinel:
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        memory: 64Mi
  # Routes the valkey service to whichever node is master, so clients
  # need no Sentinel support
  haproxy:
    replicas: 3
    image:
      repository: haproxy
      tag: "3.4.6-alpine"
      pullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 192Mi

service:
  port: 80

# Needs the Prometheus operator CRD.
metrics:
  podMonitor:
    enabled: false
    labels: {}

ingress:
  enabled: true
  className: traefik
  hosts: []
  # One of ingress.hosts; every other host answers 301 to it. Empty: every host serves the app.
  canonicalHost: ""
  annotations: {}
  tls:
    enabled: true
    # cert-manager ClusterIssuer. Empty: Traefik's default certificate.
    clusterIssuer: letsencrypt
    secretName: ""

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

priorityClassName: ""
